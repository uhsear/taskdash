# Proves a clean install works on a stock Windows runner: wheel, console script, the one-window
# installer in check mode, offline preflight, real task registration with a stored password, a
# fixture dry run and an offline dashboard build.
# No secret is used. Nothing here signs in to ArcGIS Online: preflight and dashboard run --offline,
# and collect without --apply never connects.
name: install

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build the wheel
        shell: powershell
        run: |
          python -m pip install "build==1.6.1"
          python -m build --wheel

      - name: Install the wheel into a fresh venv
        shell: powershell
        run: |
          python -m venv "$env:RUNNER_TEMP\venv"
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          # The smtp extra is what a user with mail alerts installs, so CI installs it too.
          & "$env:RUNNER_TEMP\venv\Scripts\python.exe" -m pip install "${wheel}[smtp]"
          if ($LASTEXITCODE -ne 0) { throw "pip install exited $LASTEXITCODE." }
          "TASKDASH_HOME=$env:RUNNER_TEMP\home" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TASKDASH_EXE=$env:RUNNER_TEMP\venv\Scripts\taskdash.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: taskdash --version
        shell: powershell
        run: |
          & $env:TASKDASH_EXE --version
          if ($LASTEXITCODE -ne 0) { throw "taskdash --version exited $LASTEXITCODE." }

      # The primary install path. Without -Apply it creates nothing. It must accept a SHA256SUMS.txt
      # in the form release.yml writes, refuse a wrong hash, and leave the install folder absent.
      - name: Run the one-window installer in check mode
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          $sums = Join-Path $wheel.DirectoryName "SHA256SUMS.txt"
          $hash = (Get-FileHash $wheel.FullName -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText($sums, "$hash  $($wheel.Name)`n")
          $account = "$env:COMPUTERNAME\ci_installer"
          $output = powershell -NoProfile -ExecutionPolicy Bypass -File .\Install-TaskDash.ps1 -InstallDir C:\TaskDashInstallCheck -Wheel $wheel.FullName -TaskAccount $account 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          if ($code -ne 0) { throw "Install-TaskDash.ps1 in check mode exited $code. Read its output above." }
          if ($output -notmatch "SHA-256 matches SHA256SUMS.txt") { throw "The installer did not check the wheel against SHA256SUMS.txt." }
          if ($output -notmatch "CHECK MODE") { throw "The installer did not finish in check mode." }
          if (Test-Path C:\TaskDashInstallCheck) { throw "Check mode created C:\TaskDashInstallCheck." }
          [IO.File]::WriteAllText($sums, ("0" * 64) + "  $($wheel.Name)`n")
          powershell -NoProfile -ExecutionPolicy Bypass -File .\Install-TaskDash.ps1 -InstallDir C:\TaskDashInstallCheck -Wheel $wheel.FullName -TaskAccount $account *> $null
          if ($LASTEXITCODE -ne 1) { throw "A wrong wheel hash made the installer exit $LASTEXITCODE, not 1." }
          Remove-Item $sums
          # A PowerShell step ends with the last native exit code, so the expected 1 must not leak out.
          exit 0

      - name: Offline preflight on the example config
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force $env:TASKDASH_HOME | Out-Null
          $config = Join-Path $env:TASKDASH_HOME "TaskDash.config.json"
          Copy-Item TaskDash.config.example.json $config
          $output = & $env:TASKDASH_EXE preflight --offline --config $config 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output
          # A runner has no metric log folders, no scheduled tasks to monitor and no ArcGIS Online
          # profile, so preflight reports [!!] for those environment checks and exits 1. That is
          # expected here. The job fails on a crash instead: a traceback, or any exit code above 1.
          if ($output -match "Traceback") { throw "preflight crashed. Read the traceback above." }
          if ($code -gt 1) { throw "preflight exited $code. Exit 0 or 1 is expected on a runner." }
          # A PowerShell step ends with the last native exit code, so the expected 1 must not leak out.
          exit 0

      - name: Register the task with a stored password
        shell: powershell
        run: |
          # A throw-away local user with a random password that exists only on this runner. The
          # password is masked, held as a SecureString and passed in memory; it is never a secret
          # from the repository.
          $bytes = New-Object byte[] 24
          [System.Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($bytes)
          $plain = [Convert]::ToBase64String($bytes) + "aA1!"
          Write-Host "::add-mask::$plain"
          $secure = ConvertTo-SecureString $plain -AsPlainText -Force
          $name = "ci_taskdash"
          New-LocalUser -Name $name -Password $secure -AccountNeverExpires | Out-Null
          # install_task.ps1 -Apply refuses a task account outside Administrators. The group is
          # named by SID so this holds on any Windows language. Remove-LocalUser below drops the membership.
          Add-LocalGroupMember -SID S-1-5-32-544 -Member $name
          $credential = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\$name", $secure)
          .\install_task.ps1 -TaskName TaskDashCI -InstallDir $env:TASKDASH_HOME -Python $env:TASKDASH_EXE -Credential $credential -LogonType Password -Apply
          if ($LASTEXITCODE) { throw "install_task.ps1 exited $LASTEXITCODE." }
          $actual = (Get-ScheduledTask -TaskName TaskDashCI).Principal.LogonType
          if ("$actual" -ne "Password") { throw "Registered logon type is '$actual', expected 'Password'." }

      - name: Remove the throw-away task and user
        if: always()
        shell: powershell
        run: |
          Unregister-ScheduledTask -TaskName TaskDashCI -Confirm:$false -ErrorAction SilentlyContinue
          Remove-LocalUser -Name ci_taskdash -ErrorAction SilentlyContinue

      - name: Collect from a synthetic fixture (dry run, no sign-in)
        shell: powershell
        run: |
          & $env:TASKDASH_EXE collect --fixture tests/fixtures/synthetic_app_host_01.json --config (Join-Path $env:TASKDASH_HOME "TaskDash.config.json")
          if ($LASTEXITCODE -ne 0) { throw "collect --fixture exited $LASTEXITCODE." }

      - name: Build the dashboard offline
        shell: powershell
        run: |
          & $env:TASKDASH_EXE dashboard --offline
          if ($LASTEXITCODE -ne 0) { throw "dashboard --offline exited $LASTEXITCODE." }

  tests:
    runs-on: windows-latest
    # Three fixed-offset zones without daylight saving: UTC, UTC+1 and UTC-5. The zone is set
    # with tzutil before Python starts, and a test asserts that the leg really runs in it.
    strategy:
      fail-fast: false
      matrix:
        zone:
          - { id: "UTC", offset: "0" }
          - { id: "W. Central Africa Standard Time", offset: "3600" }
          - { id: "SA Pacific Standard Time", offset: "-18000" }
    env:
      TASKDASH_EXPECT_UTC_OFFSET_S: ${{ matrix.zone.offset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set the time zone
        run: tzutil /s "${{ matrix.zone.id }}"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # The tests import arcgis but replace its network calls with fakes. pyyaml lets the
      # workflow-parsing tests run; without it they would skip.
      - name: Install test dependencies
        run: python -m pip install "arcgis>=2.4,<3" pytest "pyyaml>=6,<7"

      - name: Run the full suite
        run: python -m pytest -q -p no:cacheprovider

  # Scans every commit of this repository for leaked credentials. The pinned binary needs no token.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The checksums file comes from the same release, so it catches a corrupt or truncated
      # download, not a tampered release. A failed check ends the job before anything is extracted.
      - name: gitleaks over the full history
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v8.21.2
          archive=gitleaks_8.21.2_linux_x64.tar.gz
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_8.21.2_checksums.txt"
          grep " $archive\$" gitleaks_8.21.2_checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --verbose .
